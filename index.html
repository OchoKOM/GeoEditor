<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Éditeur de Formes Géographiques</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Configuration globale */
        body {
            font-family: "Inter", sans-serif;
            background-color: #f8fafc; /* Slate-50 */
            color: #1e293b; /* Slate-800 */
        }

        /* Layout Principal */
        .main-container {
            display: flex;
            height: calc(100vh - 64px); /* Hauteur ajustée header */
            position: relative;
            overflow: hidden;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Panneau Latéral (Inspecteur) */
        #attributes-panel {
            width: 320px;
            background-color: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.03);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(0);
        }

        /* États du panneau */
        .panel-hidden #attributes-panel {
            transform: translateX(100%);
            width: 0; 
            border: none;
        }

        /* Boutons d'action */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-icon:active {
            transform: scale(0.98);
        }

        /* Toggle Flottant Map */
        #mapInspectorToggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 400;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .panel-hidden #mapInspectorToggle {
            right: 1rem;
        }

        /* Leaflet Overrides */
        .leaflet-container {
            background-color: #e2e8f0;
            font-family: "Inter", sans-serif;
        }
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
        }
        .leaflet-bar a {
            border-radius: 0.375rem !important; /* Tailwind rounded-md */
            margin-bottom: 4px !important;
            border-bottom: none !important;
        }
        
        /* Highlight Feature */
        .selected-feature-highlight {
            filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.6));
            stroke: #3b82f6;
            stroke-width: 3px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.4); /* Slate-900/40 */
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-out;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.95);
            transition: transform 0.2s ease-out;
        }
        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        /* Data Table */
        .table-container {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .data-table th {
            background-color: #f8fafc;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }
        .data-table td {
            border-bottom: 1px solid #f1f5f9;
        }
        .data-table tr:hover td {
            background-color: #f8fafc;
        }
        .data-table input:focus {
            background-color: #f0f9ff;
            box-shadow: inset 0 0 0 2px #bae6fd;
        }

        /* Toast Message */
        #messageContainer {
            z-index: 2000;
            pointer-events: none;
        }
        
        /* Utilities */
        .hidden-force {
            display: none !important;
        }
    </style>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet.Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <!-- SHP Write -->
    <script src="https://unpkg.com/@mapbox/shp-write@latest/shpwrite.js"></script>
</head>

<body class="flex flex-col h-screen overflow-hidden text-sm">

    <!-- HEADER -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 shadow-sm z-30">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm">
                <i data-lucide="map" class="w-6 h-6"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800 tracking-tight">GeoEditor <span class="text-slate-400 font-normal text-sm">Web</span></h1>
        </div>

        <div class="flex items-center gap-2">
            <!-- Input caché -->
            <input type="file" id="fileInput" accept=".geojson, .zip" class="hidden" onchange="loadFile()" />
            
            <label for="fileInput" class="btn-icon bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-md cursor-pointer border border-slate-200 font-medium">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Importer</span>
            </label>

            <div class="h-6 w-px bg-slate-300 mx-1"></div>

            <button onclick="openTableModal()" class="btn-icon bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-md border border-slate-200 font-medium">
                <i data-lucide="table" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Données</span>
            </button>

            <div class="flex rounded-md shadow-sm" role="group">
                <button id="exportGeoJSONButton" onclick="openExportModal('geojson')" class="btn-icon bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-l-md border border-indigo-200 font-medium disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">GeoJSON</span>
                </button>
                <button id="exportShapefileButton" onclick="openExportModal('shp')" class="btn-icon bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-r-md border-t border-b border-r border-indigo-200 font-medium disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="package" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Shapefile</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="main-container">
        
        <!-- Bouton Toggle Flottant -->
        <button id="mapInspectorToggle" onclick="toggleAttributePanel()" class="p-2 rounded-lg text-slate-600 hover:text-blue-600 hover:bg-slate-50 transition-colors" title="Basculer l'inspecteur">
            <i id="toggleIcon" data-lucide="panel-right-close" class="w-5 h-5"></i>
        </button>

        <!-- CARTE -->
        <div id="map"></div>

        <!-- SIDEBAR (INSPECTOR) -->
        <aside id="attributes-panel">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                    <i data-lucide="info" class="w-4 h-4 text-blue-500"></i>
                    Propriétés
                </h2>
                <button onclick="toggleAttributePanel()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex-grow overflow-y-auto p-4">
                <div id="attribute-info" class="flex flex-col items-center justify-center h-40 text-center text-slate-400 p-4 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50">
                    <i data-lucide="mouse-pointer-2" class="w-8 h-8 mb-2 opacity-50"></i>
                    <p class="text-sm">Sélectionnez une forme sur la carte</p>
                </div>

                <div id="attributes-form" class="hidden">
                    <div class="mb-4 flex items-center gap-2">
                        <span class="text-xs font-mono bg-slate-100 text-slate-500 px-2 py-1 rounded" id="currentFeatureId">ID</span>
                        <span class="text-xs px-2 py-1 rounded bg-blue-100 text-blue-700 font-semibold" id="currentFeatureType">Type</span>
                    </div>

                    <div id="inspector-list" class="space-y-3 text-sm">
                        <!-- Liste attributs lecture seule -->
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <button onclick="openTableModal()" class="w-full btn-icon bg-white border border-slate-300 hover:border-blue-400 hover:text-blue-600 text-slate-700 py-2 rounded-lg shadow-sm font-medium">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                    Éditer les attributs
                </button>
            </div>
        </aside>
    </div>

    <!-- MODAL TABLEAU -->
    <div id="tableModal" class="modal-overlay" onclick="closeTableModal(event)">
        <div class="modal-content w-11/12 max-w-6xl h-[85vh] flex flex-col" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="database" class="w-5 h-5 text-blue-600"></i>
                        Tableau de Données
                    </h2>
                    <p class="text-slate-500 text-xs mt-1">Gérez les attributs de toutes les géométries.</p>
                </div>
                <button onclick="closeTableModal()" class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-2 rounded-full transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Toolbar Table -->
            <div class="px-6 py-3 bg-slate-50 border-b border-slate-100 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="relative">
                        <i data-lucide="plus" class="absolute left-2.5 top-2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="newColumnName" placeholder="Nouvelle colonne..." class="pl-9 pr-3 py-1.5 rounded-md border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none w-48 shadow-sm">
                    </div>
                    <button onclick="addNewColumn()" class="btn-icon bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md text-sm font-medium shadow-sm">
                        Ajouter
                    </button>
                </div>
                <div class="text-xs text-slate-500 italic flex items-center gap-1">
                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                    Sauvegardez pour valider les changements
                </div>
            </div>

            <!-- Table Scrollable -->
            <div class="flex-grow overflow-auto table-container bg-white">
                <table class="w-full text-left border-collapse data-table" id="attributesTable">
                    <thead>
                        <!-- JS generated -->
                    </thead>
                    <tbody class="text-slate-600">
                        <!-- JS generated -->
                    </tbody>
                </table>
            </div>

            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeTableModal()" class="px-4 py-2 text-slate-600 hover:text-slate-800 font-medium">Annuler</button>
                <button onclick="saveTableData()" class="btn-icon bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow-sm font-bold">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Enregistrer Tout
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL EXPORT (Unified) -->
    <div id="exportModal" class="modal-overlay" onclick="closeExportModal(event)">
        <div class="modal-content w-full max-w-lg p-6" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600">
                        <i data-lucide="download-cloud" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Exporter les données</h2>
                        <p class="text-sm text-slate-500" id="exportSubtitle">Configuration de l'export</p>
                    </div>
                </div>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Champ Nom du fichier (Commun) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nom du fichier</label>
                    <div class="relative">
                        <i data-lucide="file-text" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="exportFilename" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="mon_fichier">
                    </div>
                    <p class="text-xs text-slate-400 mt-1 text-right" id="exportExtensionPreview">.geojson</p>
                </div>

                <!-- Options Shapefile (Masqué si GeoJSON) -->
                <div id="shpOptions" class="space-y-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Système de Projection (PRJ)</label>
                        <select id="projectionSelect" onchange="handleProjectionChange()" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <!-- Peuplé par JS -->
                        </select>
                        
                        <!-- Textarea brut pour Custom (masqué par défaut) -->
                        <textarea id="prjInput" rows="3" class="mt-2 w-full p-2.5 border border-slate-300 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none hidden" placeholder="Collez votre chaîne WKT ici..."></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Encodage des caractères (CPG)</label>
                        <div class="relative">
                            <i data-lucide="type" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="cpgInput" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex: UTF-8" value="UTF-8">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3">
                <button onclick="closeExportModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">Annuler</button>
                <button onclick="confirmExport()" class="btn-icon bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg shadow-md font-medium transition-all">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    Exporter
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST MESSAGES -->
    <div id="messageContainer" class="fixed top-20 left-1/2 transform -translate-x-1/2 hidden flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl transition-all duration-300 text-white font-medium min-w-[300px] justify-center">
    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

    <script type="text/javascript">
        // === FIREBASE & INIT ===
        const firebaseAppUrl = "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        const firebaseAuthUrl = "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        const firebaseFirestoreUrl = "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let map;
        let drawnItems;
        let db, auth;
        let selectedLayer = null;
        let tableState = { columns: [], rows: [] };
        let currentExportFormat = 'geojson'; // geojson | shp

        // --- DEFINITION DES PROJECTIONS ---
        const PROJECTIONS = {
            "EPSG:4326": {
                name: "WGS 84 (Standard GPS)",
                wkt: 'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]'
            },
            "EPSG:2154": {
                name: "RGF93 / Lambert-93 (France)",
                wkt: 'PROJCS["RGF93_Lambert_93",GEOGCS["GCS_RGF93",DATUM["D_RGF_1993",SPHEROID["GRS_1980",6378137.0,298.257222101]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],PROJECTION["Lambert_Conformal_Conic"],PARAMETER["False_Easting",700000.0],PARAMETER["False_Northing",6600000.0],PARAMETER["Central_Meridian",3.0],PARAMETER["Standard_Parallel_1",44.0],PARAMETER["Standard_Parallel_2",49.0],PARAMETER["Latitude_Of_Origin",46.5],UNIT["Meter",1.0]]'
            },
            "EPSG:3857": {
                name: "Web Mercator (Google/Bing Maps)",
                wkt: 'PROJCS["WGS_1984_Web_Mercator_Auxiliary_Sphere",GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],PROJECTION["Mercator_Auxiliary_Sphere"],PARAMETER["False_Easting",0.0],PARAMETER["False_Northing",0.0],PARAMETER["Central_Meridian",0.0],PARAMETER["Standard_Parallel_1",0.0],PARAMETER["Auxiliary_Sphere_Type",0.0],UNIT["Meter",1.0]]'
            },
            "custom": {
                name: "Personnalisé (WKT Brut)",
                wkt: ""
            }
        };

        // --- LUCIDE ICONS INIT ---
        function refreshIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function loadFirebaseScripts() {
            return Promise.all([
                import(firebaseAppUrl),
                import(firebaseAuthUrl),
                import(firebaseFirestoreUrl),
            ]).then(([appModule, authModule, firestoreModule]) => {
                window.initializeApp = appModule.initializeApp;
                window.getAuth = authModule.getAuth;
                window.signInAnonymously = authModule.signInAnonymously;
                window.signInWithCustomToken = authModule.signInWithCustomToken;
                window.onAuthStateChanged = authModule.onAuthStateChanged;
                window.getFirestore = firestoreModule.getFirestore;
            });
        }

        function showMessage(text, type = "success") {
            const container = document.getElementById("messageContainer");
            container.innerHTML = "";
            const iconName = type === "error" ? "alert-triangle" : "check-circle-2";
            const iconHtml = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
            container.innerHTML = `${iconHtml} <span>${text}</span>`;
            
            const bgClass = type === "error" ? "bg-rose-600" : "bg-emerald-600";
            container.className = `fixed top-20 left-1/2 transform -translate-x-1/2 flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl transition-all duration-300 text-white font-medium min-w-[300px] justify-center z-[2000] ${bgClass}`;
            
            refreshIcons(); 

            container.style.opacity = "1";
            container.style.transform = "translate(-50%, 0)";
            
            setTimeout(() => {
                container.style.opacity = "0";
                container.style.transform = "translate(-50%, -20px)";
                setTimeout(() => container.classList.add("hidden"), 300);
            }, 4000);
        }

        window.toggleAttributePanel = function () {
            const container = document.querySelector(".main-container");
            const isHidden = container.classList.toggle("panel-hidden");
            
            const toggleIcon = document.getElementById("toggleIcon");
            if (toggleIcon) {
                toggleIcon.setAttribute("data-lucide", isHidden ? "panel-right-open" : "panel-right-close");
                refreshIcons();
            }
            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 300);
        };

        // === TABLE LOGIC ===
        window.openTableModal = function() {
            const layers = drawnItems.getLayers();
            if (layers.length === 0) {
                showMessage("Aucune donnée à afficher. Dessinez d'abord des formes.", "error");
                return;
            }

            layers.forEach(layer => {
                if (layer.feature) {
                    if (!layer.feature.properties) layer.feature.properties = {};
                    if (!layer.feature.properties.geom) {
                        const type = (layer.feature.geometry && layer.feature.geometry.type) ? layer.feature.geometry.type : "Inconnu";
                        layer.feature.properties.geom = type;
                    }
                }
            });

            const allKeys = new Set();
            layers.forEach(layer => {
                if (layer.feature && layer.feature.properties) {
                    Object.keys(layer.feature.properties).forEach(k => allKeys.add(k));
                }
            });

            tableState.columns = Array.from(allKeys).sort();
            tableState.rows = layers;
            renderTable();
            document.getElementById("tableModal").classList.add("open");
        };

        window.closeTableModal = function(event) {
            if (event && event.target.id !== "tableModal") return;
            document.getElementById("tableModal").classList.remove("open");
        };

        window.deleteColumn = function(key) {
            if (!confirm(`Supprimer "${key}" ?`)) return;
            tableState.rows.forEach(layer => {
                if (layer.feature && layer.feature.properties) {
                    delete layer.feature.properties[key];
                }
            });
            tableState.columns = tableState.columns.filter(col => col !== key);
            renderTable();
        };

        window.renameColumn = function(oldKey) {
            const newKey = prompt("Nouveau nom :", oldKey);
            if (!newKey || newKey.trim() === "" || newKey === oldKey) return;
            const trimmed = newKey.trim();
            if (tableState.columns.includes(trimmed)) {
                alert("Ce nom existe déjà.");
                return;
            }

            tableState.rows.forEach(layer => {
                if (layer.feature && layer.feature.properties) {
                    const val = layer.feature.properties[oldKey];
                    layer.feature.properties[trimmed] = (val === undefined) ? "" : val;
                    delete layer.feature.properties[oldKey];
                }
            });
            const idx = tableState.columns.indexOf(oldKey);
            if (idx !== -1) tableState.columns[idx] = trimmed;
            renderTable();
        };

        function renderTable() {
            const thead = document.querySelector("#attributesTable thead");
            const tbody = document.querySelector("#attributesTable tbody");
            thead.innerHTML = "";
            tbody.innerHTML = "";

            // HEADER
            const headerRow = document.createElement("tr");
            
            const thId = document.createElement("th");
            thId.className = "p-3 border-b bg-slate-50 w-20 text-center";
            thId.innerHTML = "ID";
            headerRow.appendChild(thId);

            tableState.columns.forEach(key => {
                const th = document.createElement("th");
                th.className = "p-3 border-b bg-slate-50 min-w-[180px]";
                
                const wrapper = document.createElement("div");
                wrapper.className = "flex items-center justify-between";
                
                const title = document.createElement("span");
                title.className = "font-semibold text-slate-700";
                title.textContent = key;
                wrapper.appendChild(title);

                if (key !== 'geom') {
                    const actions = document.createElement("div");
                    actions.className = "flex items-center gap-1 opacity-50 hover:opacity-100 transition-opacity";
                    
                    const editBtn = document.createElement("button");
                    editBtn.innerHTML = `<i data-lucide="pencil" class="w-3 h-3"></i>`;
                    editBtn.className = "p-1 hover:bg-blue-100 hover:text-blue-600 rounded";
                    editBtn.title = "Renommer";
                    editBtn.onclick = () => renameColumn(key);
                    
                    const delBtn = document.createElement("button");
                    delBtn.innerHTML = `<i data-lucide="trash-2" class="w-3 h-3"></i>`;
                    delBtn.className = "p-1 hover:bg-red-100 hover:text-red-600 rounded";
                    delBtn.title = "Supprimer";
                    delBtn.onclick = () => deleteColumn(key);

                    actions.append(editBtn, delBtn);
                    wrapper.appendChild(actions);
                }
                th.appendChild(wrapper);
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            // ROWS
            tableState.rows.forEach((layer, rowIndex) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition-colors";

                const tdId = document.createElement("td");
                const shortId = (layer.feature && layer.feature.id) ? layer.feature.id.substring(0, 4) : "?";
                tdId.className = "p-2 text-center border-r border-slate-100";
                tdId.innerHTML = `<span class="font-mono text-xs text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded select-all">${shortId}</span>`;
                tr.appendChild(tdId);

                tableState.columns.forEach(key => {
                    const td = document.createElement("td");
                    td.className = "p-0 border-r border-slate-100 relative";
                    
                    const input = document.createElement("input");
                    input.type = "text";
                    input.className = "w-full h-full p-3 bg-transparent border-none focus:ring-0 text-sm";
                    
                    let val = layer.feature?.properties?.[key] ?? "";
                    input.value = val;
                    input.dataset.rowIndex = rowIndex;
                    input.dataset.key = key;

                    if (key === 'geom') {
                        input.readOnly = true;
                        input.className += " text-slate-400 italic bg-slate-50/50 cursor-not-allowed";
                    }

                    td.appendChild(input);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            refreshIcons();
        }

        window.addNewColumn = function() {
            const nameInput = document.getElementById("newColumnName");
            const newKey = nameInput.value.trim();
            if (!newKey) return;
            if (tableState.columns.includes(newKey)) {
                showMessage("Colonne existante", "error");
                return;
            }
            tableState.columns.push(newKey);
            nameInput.value = "";
            renderTable();
        };

        window.saveTableData = function() {
            const inputs = document.querySelectorAll("#attributesTable input");
            inputs.forEach(input => {
                const rowIndex = parseInt(input.dataset.rowIndex);
                const key = input.dataset.key;
                if (rowIndex >= 0 && key && key !== 'geom') {
                    const layer = tableState.rows[rowIndex];
                    if (!layer.feature.properties) layer.feature.properties = {};
                    layer.feature.properties[key] = input.value.trim();
                }
            });
            tableState.rows.forEach(layer => updateLayerPopup(layer));
            if (selectedLayer) selectLayer(selectedLayer);
            showMessage("Données mises à jour");
            closeTableModal();
        };

        // === EXPORT & MODAL LOGIC (Unified) ===
        
        // Initialisation du select de projection
        function initProjectionSelect() {
            const select = document.getElementById('projectionSelect');
            select.innerHTML = '';
            for (const [key, info] of Object.entries(PROJECTIONS)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.text = info.name;
                select.appendChild(opt);
            }
            // Valeur par défaut: WGS84
            select.value = "EPSG:4326";
        }

        window.handleProjectionChange = function() {
            const select = document.getElementById('projectionSelect');
            const textArea = document.getElementById('prjInput');
            const val = select.value;

            if (val === 'custom') {
                textArea.classList.remove('hidden');
                // On ne vide pas le textarea pour laisser l'utilisateur coller
            } else {
                textArea.classList.add('hidden');
                // On met à jour le textarea en "background" pour l'export
                textArea.value = PROJECTIONS[val].wkt;
            }
        };

        window.openExportModal = function(format) {
            if (drawnItems.getLayers().length === 0) return showMessage("Rien à exporter", "error");
            
            currentExportFormat = format;
            
            // UI Update based on format
            const shpOptions = document.getElementById('shpOptions');
            const subtitle = document.getElementById('exportSubtitle');
            const extPreview = document.getElementById('exportExtensionPreview');
            const filenameInput = document.getElementById('exportFilename');
            
            // Générer nom par défaut
            const date = new Date().toISOString().slice(0, 10);
            filenameInput.value = `map_data_${date}`;

            initProjectionSelect(); // Reset select
            handleProjectionChange(); // Sync textarea

            if (format === 'geojson') {
                subtitle.textContent = "Export GeoJSON";
                extPreview.textContent = ".geojson";
                shpOptions.classList.add('hidden-force'); // Use dedicated class or style
                shpOptions.style.display = 'none';
            } else {
                subtitle.textContent = "Export Shapefile (.zip)";
                extPreview.textContent = ".zip";
                shpOptions.classList.remove('hidden-force');
                shpOptions.style.display = 'block';
            }

            document.getElementById("exportModal").classList.add("open");
        };

        window.closeExportModal = function (e) {
            if (e && e.target.id !== "exportModal") return;
            document.getElementById("exportModal").classList.remove("open");
        };

        window.confirmExport = function() {
            const filename = document.getElementById('exportFilename').value.trim() || "export";
            const prj = document.getElementById('prjInput').value;
            const cpg = document.getElementById('cpgInput').value;

            // Configuration
            const config = {
                filename: filename,
                prj: prj,
                cpg: cpg
            };

            exportData(currentExportFormat, config);
            closeExportModal();
        };

        // === MAP & CORE ===
        function selectLayer(layer) {
            if (selectedLayer && selectedLayer.getElement()) {
                selectedLayer.getElement().classList.remove("selected-feature-highlight");
            }
            selectedLayer = layer;
            if (selectedLayer.getElement()) {
                selectedLayer.getElement().classList.add("selected-feature-highlight");
            }

            if (!selectedLayer.feature) selectedLayer.feature = { type: "Feature", properties: {} };
            if (!selectedLayer.feature.id) selectedLayer.feature.id = crypto.randomUUID();

            document.getElementById("currentFeatureId").textContent = selectedLayer.feature.id.substring(0, 8);
            const type = selectedLayer.feature.geometry ? selectedLayer.feature.geometry.type : "Feature";
            document.getElementById("currentFeatureType").textContent = type;
            
            document.getElementById("attribute-info").classList.add("hidden");
            document.getElementById("attributes-form").classList.remove("hidden");

            const list = document.getElementById("inspector-list");
            list.innerHTML = "";
            
            const props = selectedLayer.feature.properties;
            const keys = Object.keys(props);
            
            if (keys.length === 0) {
                list.innerHTML = `<div class="text-slate-400 italic text-center py-4 flex flex-col items-center gap-2">
                    <i data-lucide="list-x" class="w-5 h-5"></i>
                    <span>Aucun attribut</span>
                </div>`;
            } else {
                keys.forEach(k => {
                    const div = document.createElement("div");
                    div.className = "flex flex-col pb-2 border-b border-slate-50 last:border-0";
                    div.innerHTML = `
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">${k}</span>
                        <span class="text-slate-800 truncate">${props[k]}</span>
                    `;
                    list.appendChild(div);
                });
            }
            refreshIcons();
        }

        function updateLayerPopup(layer) {
            if (!layer.feature || !layer.feature.properties) return;
            let html = `<div class="font-sans text-sm min-w-[150px]">`;
            let count = 0;
            for (const key in layer.feature.properties) {
                count++;
                let val = String(layer.feature.properties[key]);
                if (val.length > 30) val = val.substring(0, 30) + "...";
                html += `<div class="flex justify-between border-b border-gray-100 py-1 last:border-0">
                    <span class="font-bold text-slate-600 mr-2">${key}:</span>
                    <span class="text-slate-800">${val}</span>
                </div>`;
            }
            if (count === 0) html += `<span class="italic text-gray-400">Sans attributs</span>`;
            html += `</div>`;
            
            if (layer.getPopup()) layer.unbindPopup();
            layer.bindPopup(html);
        }

        function initMap() {
            map = L.map("map", { zoomControl: false }).setView([48.8566, 2.3522], 10);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; OpenStreetMap',
            }).addTo(map);

            drawnItems = new L.FeatureGroup().addTo(map);
            
            const drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems },
                draw: { 
                    polygon: { showArea: true },
                    polyline: true, rectangle: true, circle: true, marker: true, circlemarker: true
                }
            });
            map.addControl(drawControl);

            map.on(L.Draw.Event.CREATED, function (event) {
                const layer = event.layer;
                const geojson = layer.toGeoJSON();
                layer.feature = layer.feature || geojson;
                if (!layer.feature.geometry && geojson.geometry) layer.feature.geometry = geojson.geometry;
                if (!layer.feature.properties) {
                    layer.feature.properties = { 
                        nom: "Nouvelle Forme", 
                        date: new Date().toISOString().slice(0, 10) 
                    };
                }
                if (!layer.feature.id) layer.feature.id = crypto.randomUUID();
                
                updateLayerPopup(layer);
                drawnItems.addLayer(layer);
                selectLayer(layer);
                updateExportButtonState();
            });

            map.on("draw:edited", updateExportButtonState);
            map.on("draw:deleted", () => {
                if (selectedLayer && !drawnItems.hasLayer(selectedLayer)) {
                    selectedLayer = null;
                    document.getElementById("attributes-form").classList.add("hidden");
                    document.getElementById("attribute-info").classList.remove("hidden");
                }
                updateExportButtonState();
            });
            drawnItems.on("click", (e) => selectLayer(e.layer));
            map.on("draw:editstart", () => {
                if(selectedLayer?.getElement()) selectedLayer.getElement().classList.remove('selected-feature-highlight');
            });
        }

        function updateExportButtonState() {
            const has = drawnItems.getLayers().length > 0;
            document.getElementById("exportGeoJSONButton").disabled = !has;
            document.getElementById("exportShapefileButton").disabled = !has;
        }

        // Import/Export Logic
        window.loadFile = function () {
            const file = document.getElementById("fileInput").files[0];
            if (!file) return;
            const reader = new FileReader();
            const ext = file.name.split('.').pop().toLowerCase();
            
            reader.onload = async function (e) {
                try {
                    let geojson;
                    if (ext === "geojson") geojson = JSON.parse(e.target.result);
                    else if (ext === "zip") geojson = await shp(e.target.result);
                    
                    if(geojson) {
                        drawnItems.clearLayers();
                        const fc = Array.isArray(geojson) ? {type:"FeatureCollection", features: geojson.flat()} : geojson;
                        const l = L.geoJSON(fc, {
                            pointToLayer: (f, latlng) => {
                                const m = L.marker(latlng);
                                m.feature = f;
                                return m;
                            },
                            onEachFeature: (f, l) => {
                                l.feature = f;
                                updateLayerPopup(l);
                                l.on("click", (e)=>selectLayer(e.target));
                            }
                        });
                        l.eachLayer(layer => drawnItems.addLayer(layer));
                        if(l.getLayers().length > 0 && l.getBounds().isValid()) map.fitBounds(l.getBounds());
                        updateExportButtonState();
                        showMessage("Fichier importé");
                    }
                } catch(err) {
                    showMessage("Erreur: " + err.message, "error");
                }
            };
            if(ext==="geojson") reader.readAsText(file); else reader.readAsArrayBuffer(file);
        };

        // Modifié pour accepter la config (nom, prj)
        window.exportData = async function (format, config = {}) {
            if (drawnItems.getLayers().length === 0) return;
            
            const data = drawnItems.toGeoJSON();
            // Fallback si config vide
            const filename = config.filename || "map_export";
            
            if (format === "geojson") {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                downloadBlob(blob, `${filename}.geojson`);
                showMessage("Export GeoJSON terminé");
            } else if (format === "shp") {
                const validFeatures = data.features.filter(f => f.geometry && f.geometry.type !== 'GeometryCollection');
                if (validFeatures.length === 0) return showMessage("Géométrie invalide pour Shapefile", "error");
                
                const sanitize = (props) => {
                    const res = {};
                    for (const k in props) {
                        const cleanK = k.substring(0, 10).toLowerCase().replace(/[^a-z0-9_]/g, '');
                        if (cleanK) res[cleanK] = typeof props[k] === 'object' ? JSON.stringify(props[k]) : String(props[k] ?? "");
                    }
                    return res;
                };

                const exportData = { 
                    type: "FeatureCollection", 
                    features: validFeatures.map(f => ({ ...f, properties: sanitize(f.properties) })) 
                };
                
                try {
                    const opts = { 
                        folder: filename, 
                        types: { point: "points", polygon: "polygons", line: "lines" }, 
                        prj: config.prj || PROJECTIONS["EPSG:4326"].wkt, 
                        cpg: config.cpg || "UTF-8", 
                        outputType: 'blob' 
                    };
                    const result = await shpwrite.zip(exportData, opts);
                    downloadBlob(result, `${filename}.zip`);
                    showMessage("Export Shapefile terminé");
                } catch(e) {
                    showMessage(e.message, "error");
                }
            }
        };

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        async function setupFirebase() {
            await loadFirebaseScripts();
            const appId = typeof __app_id !== "undefined" ? __app_id : "default-app-id";
            const firebaseConfig = typeof __firebase_config !== "undefined" ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== "undefined" ? __initial_auth_token : null;
            if (firebaseConfig) {
                try {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    onAuthStateChanged(auth, async (user) => {
                        if (!user) {
                            if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                            else await signInAnonymously(auth);
                        }
                    });
                } catch (e) { console.error(e); }
            }
        }

        window.onload = function () {
            initMap();
            setupFirebase();
            refreshIcons();
            initProjectionSelect(); // Init default
        };
    </script>
</body>
</html>
